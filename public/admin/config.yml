backend:
  name: github
  repo: Rony-Mia/Utools.bd
  branch: main
  base_url: https://utools.bd
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "global"
    label: "গ্লোবাল ও সাইট কনটেন্ট"
    files:
      - name: "navbar"
        label: "নেভিগেশন বার (Navbar)"
        file: "content/global/navbar.json"
        fields:
          - { name: "brandName", label: "ব্র্যান্ডের নাম", widget: "string" }
          - { name: "tagline", label: "ট্যাগলাইন", widget: "string" }
          - { name: "homeLabel", label: "হোম লিংক লেবেল", widget: "string" }
          - { name: "blogLabel", label: "ব্লগ লিংক লেবেল", widget: "string" }
      - name: "footer"
        label: "ফুটার (Footer)"
        file: "content/global/footer.json"
        fields:
          - { name: "brandDescription", label: "ব্র্যান্ড বিবরণ", widget: "text" }
          - { name: "privacyBadge", label: "প্রাইভেসি ব্যাজ টেক্সট", widget: "string" }
          - { name: "copyrightText", label: "কপিরাইট টেক্সট", widget: "string" }
          - { name: "slogan", label: "স্লোগান", widget: "string" }
          - { name: "imageToolsHeading", label: "ইমেজ হেডিং", widget: "string" }
          - { name: "pdfDocumentHeading", label: "পিডিএফ হেডিং", widget: "string" }
          - { name: "textCalcHeading", label: "ক্যালকুলেটর হেডিং", widget: "string" }
          - { name: "importantLinksHeading", label: "জরুরি লিংক হেডিং", widget: "string" }
      - name: "home"
        label: "হোমপেজ লেআউট ও ব্যানার"
        file: "content/pages/home.json"
        fields:
          - name: "metaTitle"
            label: "এসইও টাইটেল (SEO Title)"
            widget: "string"
            hint: "Google-এ ৫৫-৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — ছোট রাখুন"
            pattern: ['^.{1,65}$', "টাইটেল ৬৫ ক্যারেক্টারের বেশি না রাখাই ভালো"]
          - name: "metaDescription"
            label: "এসইও মেটা বিবরণ (Meta Description)"
            widget: "text"
            hint: "Google-এ ১৫৫-১৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — সংক্ষেপে লিখুন"
            pattern: ['^.{1,160}$', "মেটা ডেসক্রিপশন ১৬০ ক্যারেক্টারের বেশি না রাখাই ভালো"]
          - { name: "heroBadge", label: "হিরো ব্যাজ", widget: "string" }
          - { name: "heroTitlePrefix", label: "হিরো টাইটেল প্রিফিক্স", widget: "string" }
          - { name: "heroTitleHighlight", label: "হিরো টাইটেল হাইলাইট", widget: "string" }
          - { name: "heroTitleSuffix", label: "হিরো টাইটেল সাফিক্স", widget: "string" }
          - { name: "heroSubtitle", label: "হিরো সাবটাইটেল", widget: "text" }
          - label: "হিরো বুলেট পয়েন্টস"
            name: "heroPoints"
            widget: "list"
            required: false
            field: { name: "point", label: "পয়েন্ট", widget: "string" }
          - label: "ব্লগ সেকশন হেডিং"
            name: "blogHeading"
            widget: "object"
            required: false
            fields:
              - { name: "badge", label: "ব্যাজ", widget: "string" }
              - { name: "title", label: "শিরোনাম (H2)", widget: "string" }
              - { name: "subtitle", label: "সাবটাইটেল", widget: "string" }
      - name: "home-faq"
        label: "হোমপেজ এফএকিউ (FAQ)"
        file: "content/global/home-faq.json"
        fields:
          - label: "প্রশ্নোত্তর তালিকা"
            name: "faqs"
            widget: "list"
            fields:
              - { name: "question", label: "প্রশ্ন", widget: "string" }
              - { name: "answer", label: "উত্তর", widget: "text" }

  - name: "pages"
    label: "সকল পেজ ও টুলসমূহ (Pages & Tools)"
    folder: "content/pages"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} ({{slug}})"
    fields:
      - { name: "title", label: "পেজ টাইটেল (H1)", widget: "string" }
      - { name: "slug", label: "স্লাগ / ফাইল নাম (URL Slug)", widget: "string", required: false, hint: "ফাইল ও ইউআরএল স্লাগ (যেমন: age-calculator, photo-resizer)" }
      - { name: "subtitle", label: "সাবটাইটেল / বিবরণ", widget: "text", required: false }
      - name: "metaTitle"
        label: "এসইও টাইটেল (SEO Title)"
        widget: "string"
        required: false
        hint: "Google-এ ৫৫-৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — ছোট রাখুন"
        pattern: ['^.{1,65}$', "টাইটেল ৬৫ ক্যারেক্টারের বেশি না রাখাই ভালো"]
      - name: "metaDescription"
        label: "এসইও মেটা বিবরণ (Meta Description)"
        widget: "text"
        required: false
        hint: "Google-এ ১৫৫-১৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — সংক্ষেপে লিখুন"
        pattern: ['^.{1,160}$', "মেটা ডেসক্রিপশন ১৬০ ক্যারেক্টারের বেশি না রাখাই ভালো"]
      - name: "metaOgDescription"
        label: "সোশ্যাল শেয়ার বিবরণ (OG Description)"
        widget: "text"
        required: false
        hint: "Facebook/Twitter শেয়ার বিবরণ"
        pattern: ['^.{1,160}$', "মেটা ডেসক্রিপশন ১৬০ ক্যারেক্টারের বেশি না রাখাই ভালো"]
      - { name: "badge", label: "ব্যাজ টেক্সট", widget: "string", required: false }
      - { name: "badgeText", label: "বিকল্প ব্যাজ টেক্সট", widget: "string", required: false }
      - { name: "introText", label: "ভূমিকা টেক্সট", widget: "text", required: false }
      - { name: "faqHeading", label: "এফএকিউ হেডিং", widget: "string", required: false, default: "প্রায়শই জিজ্ঞাসিত প্রশ্নাবলী (FAQ)" }
      - label: "প্রশ্নোত্তর তালিকা (FAQ)"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { name: "question", label: "প্রশ্ন", widget: "string" }
          - { name: "answer", label: "উত্তর", widget: "text" }
      - { name: "featuresHeading", label: "ফিচার হেডিং", widget: "string", required: false }
      - label: "ফিচার তালিকা (Features)"
        name: "features"
        widget: "list"
        required: false
        fields:
          - { name: "title", label: "শিরোনাম", widget: "string" }
          - { name: "desc", label: "বিবরণ", widget: "text", required: false }
      - { name: "stepsHeading", label: "ধাপসমূহের হেডিং", widget: "string", required: false }
      - label: "ধাপসমূহ (Steps)"
        name: "steps"
        widget: "list"
        required: false
        fields:
          - { name: "step", label: "ধাপ নং", widget: "string", required: false }
          - { name: "title", label: "শিরোনাম", widget: "string" }
          - { name: "desc", label: "বিবরণ", widget: "text", required: false }
      - label: "হাউ-টু নির্দেশিকা ধাপসমূহ (How-To Steps)"
        name: "howToSteps"
        widget: "list"
        required: false
        fields:
          - { name: "stepNum", label: "ধাপ নং", widget: "string", required: false }
          - { name: "title", label: "শিরোনাম", widget: "string" }
          - { name: "desc", label: "বিবরণ", widget: "text", required: false }
      - { name: "guidelinesHeading", label: "অফিশিয়াল নির্দেশিকা হেডিং", widget: "string", required: false }
      - label: "নির্দেশিকা তালিকা (Guidelines)"
        name: "guidelines"
        widget: "list"
        required: false
        fields:
          - { name: "title", label: "শিরোনাম", widget: "string" }
          - { name: "desc", label: "বিবরণ", widget: "text", required: false }
      - { name: "deepDiveTitle", label: "বিস্তারিত গাইড হেডিং", widget: "string", required: false }
      - label: "বিস্তারিত গাইড অনুচ্ছেদসমূহ (Deep Dive Paragraphs)"
        name: "deepDiveParagraphs"
        widget: "list"
        required: false
        field: { name: "para", label: "অনুচ্ছেদ", widget: "text" }
      - { name: "guideHeading", label: "গাইড হেডিং", widget: "string", required: false }
      - label: "গাইড অনুচ্ছেদসমূহ"
        name: "guideParagraphs"
        widget: "list"
        required: false
        field: { name: "para", label: "অনুচ্ছেদ", widget: "text" }
      - { name: "originTitle", label: "পটভূমি ও ইতিহাস শিরোনাম", widget: "string", required: false }
      - label: "পটভূমি অনুচ্ছেদসমূহ"
        name: "originParagraphs"
        widget: "list"
        required: false
        field: { name: "para", label: "অনুচ্ছেদ", widget: "text" }
      - { name: "sellingPointTitle", label: "হাইলাইট টাইটেল", widget: "string", required: false }
      - { name: "sellingPointDesc", label: "হাইলাইট বিবরণ", widget: "text", required: false }
      - { name: "presetStepTitle", label: "প্রিসেট সেকশন শিরোনাম", widget: "string", required: false }
      - { name: "photoRulesTitle", label: "ছবির নিয়মাবলী টাইটেল", widget: "string", required: false }
      - label: "ছবির নিয়মাবলী পয়েন্ট"
        name: "photoRules"
        widget: "list"
        required: false
        field: { name: "rule", label: "পয়েন্ট", widget: "string" }
      - { name: "signatureRulesTitle", label: "স্বাক্ষরের নিয়মাবলী টাইটেল", widget: "string", required: false }
      - label: "স্বাক্ষরের নিয়মাবলী পয়েন্ট"
        name: "signatureRules"
        widget: "list"
        required: false
        field: { name: "rule", label: "পয়েন্ট", widget: "string" }
      - { name: "tableTitle", label: "রেফারেন্স টেবিল শিরোনাম", widget: "string", required: false }
      - { name: "uploadTitle", label: "আপলোড সেকশন শিরোনাম", widget: "string", required: false }
      - { name: "useCasesHeading", label: "ব্যবহারের ক্ষেত্র শিরোনাম", widget: "string", required: false }
      - { name: "emailLabel", label: "ইমেইল লেবেল", widget: "string", required: false }
      - { name: "emailAddress", label: "অফিসিয়াল ইমেইল এড্রেস", widget: "string", required: false }
      - { name: "responseNote", label: "রেসপন্স নোট", widget: "text", required: false }
      - { name: "lastUpdated", label: "সর্বশেষ পরিমার্জন তারিখ", widget: "string", required: false }
      - { name: "heroBadge", label: "হিরো ব্যাজ (হোমপেজ)", widget: "string", required: false }
      - { name: "heroTitlePrefix", label: "হিরো প্রিফিক্স", widget: "string", required: false }
      - { name: "heroTitleHighlight", label: "হিরো হাইলাইট", widget: "string", required: false }
      - { name: "heroTitleSuffix", label: "হিরো সাফিক্স", widget: "string", required: false }
      - { name: "heroSubtitle", label: "হিরো সাবটাইটেল", widget: "text", required: false }
      - { name: "content", label: "মূল কনটেন্ট (Markdown - যদি থাকে)", widget: "markdown", required: false }

  - name: "blog"
    label: "ব্লগ ও গাইড (Blog Posts)"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - name: "title"
        label: "পোস্টের শিরোনাম (H1)"
        widget: "string"
        hint: "Google-এ ৫৫-৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — ছোট রাখুন"
        pattern: ['^.{1,65}$', "টাইটেল ৬৫ ক্যারেক্টারের বেশি না রাখাই ভালো"]
      - { name: "slug", label: "স্লাগ (URL Slug)", widget: "string" }
      - { name: "date", label: "প্রকাশের তারিখ (YYYY-MM-DD)", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "updatedDate", label: "সর্বশেষ আপডেটের তারিখ", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: "author", label: "লেখকের নাম", widget: "string", default: "ইউটিলিটি টিম" }
      - label: "ক্যাটাগরি"
        name: "category"
        widget: "select"
        options: ["সংস্কৃতি ও ইতিহাস", "চাকরির প্রস্তুতি", "বাংলা টাইপিং", "শিক্ষা ও রেজাল্ট", "ডিজিটাল গাইড", "ইউটিলিটি টিপস"]
        default: "ডিজিটাল গাইড"
      - label: "ট্যাগসমূহ (Tags)"
        name: "tags"
        widget: "list"
        required: false
      - name: "excerpt"
        label: "সংক্ষিপ্ত বিবরণ (Excerpt / Summary)"
        widget: "text"
        hint: "Google-এ ১৫৫-১৬০ ক্যারেক্টারের বেশি হলে কেটে যায় — সংক্ষেপে লিখুন"
        pattern: ['^.{1,160}$', "মেটা ডেসক্রিপশন ১৬০ ক্যারেক্টারের বেশি না রাখাই ভালো"]
      - { name: "image", label: "ফিচার্ড ছবি (Featured Image)", widget: "image", required: false }
      - { name: "imageAlt", label: "ছবির বিকল্প লেখা (Image Alt Text)", widget: "string", required: false }
      - { name: "readTime", label: "পড়ার আনুমানিক সময়", widget: "string", default: "৪ মিনিট" }
      - { name: "published", label: "প্রকাশিত অবস্থা (Published)", widget: "boolean", default: true }
      - { name: "showOnHomepage", label: "হোমপেজে দেখান (Show on Homepage)", widget: "boolean", default: true }
      - { name: "homepageFeatured", label: "হোমপেজ ফিচার্ড পোস্ট (Homepage Featured)", widget: "boolean", default: false }
      - { name: "homepageOrder", label: "হোমপেজ ক্রম (Homepage Order)", widget: "number", value_type: "int", default: 1 }
      - label: "সম্পর্কিত টুল পাথ (Related Tool Path)"
        name: "relatedTool"
        widget: "select"
        options:
          - { label: "কোনোটি নয়", value: "" }
          - { label: "বিজয় ↔ ইউনিকোড টেক্সট কনভার্টার (/converter)", value: "/converter" }
          - { label: "টাইপিং স্পিড টেস্ট (Typing Speed Test) (/typing-test)", value: "/typing-test" }
          - { label: "সরকারি ও পাসপোর্ট ছবি রিসাইজার (/photo-resizer)", value: "/photo-resizer" }
          - { label: "বাল্ক ফটো রিসাইজার (Bulk Resizer) (/bulk-photo-resizer)", value: "/bulk-photo-resizer" }
          - { label: "HEIC থেকে JPG/PNG কনভার্টার (/heic-converter)", value: "/heic-converter" }
          - { label: "ইমেজ মার্জার ও কোলাজ মেকার (/image-merger)", value: "/image-merger" }
          - { label: "ছবি থেকে পিডিএফ কনভার্টার (Image to PDF) (/image-to-pdf)", value: "/image-to-pdf" }
          - { label: "কাস্টম QR কোড জেনারেটর (/qr-generator)", value: "/qr-generator" }
          - { label: "সরকারি চাকরির বয়স ক্যালকুলেটর (/age-calculator)", value: "/age-calculator" }
          - { label: "টাকা → কথায় কনভার্টার (Amount in Words) (/amount-in-words)", value: "/amount-in-words" }
          - { label: "বাংলা তারিখ কনভার্টার (Bangla Date Converter) (/bangla-date-converter)", value: "/bangla-date-converter" }
          - { label: "জিপিএ ও সিজিপিএ ক্যালকুলেটর (GPA & CGPA Calculator) (/gpa-calculator)", value: "/gpa-calculator" }
          - { label: "জমির মাপ কনভার্টার (Land Area Converter) (/land-converter)", value: "/land-converter" }
          - { label: "স্বর্ণের পরিমাপ ও দাম ক্যালকুলেটর (Gold Calculator) (/gold-calculator)", value: "/gold-calculator" }
          - { label: "সংখ্যা পদ্ধতি ও আইসিটি কনভার্টার (Number System) (/number-system-converter)", value: "/number-system-converter" }
          - { label: "সিভি ও জীবনবৃত্তান্ত মেকার (CV Builder) (/cv-builder)", value: "/cv-builder" }
          - { label: "পিডিএফ মার্জার (PDF Merger) (/pdf-merger)", value: "/pdf-merger" }
          - { label: "পিডিএফ স্প্লিটার (PDF Splitter) (/pdf-split)", value: "/pdf-split" }
          - { label: "পিডিএফ পেজ ডিলিট (Delete Pages) (/pdf-delete-pages)", value: "/pdf-delete-pages" }
          - { label: "পিডিএফ রোটেট (PDF Rotate) (/pdf-rotate)", value: "/pdf-rotate" }
          - { label: "পিডিএফ ওয়াটারমার্ক ও পেজ নম্বর (/pdf-watermark-page-number)", value: "/pdf-watermark-page-number" }
