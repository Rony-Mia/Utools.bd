<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utools.bd CMS — অ্যাডমিন প্যানেল</title>
  <!--
    Fixes "Failed to load config.yml (404)": when this page is reached at
    /admin (no trailing slash) instead of /admin/, the browser's relative-URL
    base is the site root, so Decap CMS's relative fetch("config.yml") was
    resolving to https://utools.bd/config.yml instead of .../admin/config.yml.
    An explicit <base> pins every relative URL on this page to /admin/
    regardless of which form of the URL the visitor lands on.
  -->
  <base href="/admin/" />
  <link rel="cms-config-url" href="/admin/config.yml?v=3" type="text/yaml" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <!-- This gate's own logout (clears only the utools_admin_gate cookie via
       middleware.ts; does not touch Decap CMS's GitHub login). -->
  <a
    href="/admin/logout"
    style="position:fixed;bottom:10px;right:10px;z-index:9999;font:12px -apple-system,sans-serif;color:#6b7280;background:#fff;border:1px solid #e5e7eb;padding:4px 10px;border-radius:999px;text-decoration:none;"
  >Basic Auth Logout</a>
  <!-- Decap CMS (Formerly Netlify CMS) CDN script -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
</body>
</html>
